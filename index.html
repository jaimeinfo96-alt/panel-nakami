<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Panel · Mentoría Nakami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000;--bg:#0D0D0D;--paper:#F7F3EF;--muted:rgba(247,243,239,.55);
    --line:rgba(247,243,239,.12);--glass:rgba(247,243,239,.05);--gold:#FFE000;
    --green:#3ddc84;--red:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--paper);
    min-height:100dvh;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',monospace}

  /* ---- login screen ---- */
  #login-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:24px;text-align:center}
  #login-screen h1{font-size:26px;font-weight:600}
  #login-screen p{color:var(--muted);font-size:14.5px;max-width:360px;line-height:1.5}
  .gbtn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;border-radius:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    font:inherit;font-size:15px;font-weight:600}
  .gbtn svg{width:18px;height:18px}
  .denied{color:var(--red);font-size:14px;margin-top:4px}

  /* ---- app shell ---- */
  #app-screen{display:none;min-height:100dvh;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
  .brand{display:flex;flex-direction:column;line-height:1.2}
  .brand b{font-size:16px;font-weight:700}
  .brand span{font-size:11.5px;color:var(--muted)}
  .who{display:flex;align-items:center;gap:10px}
  .who span{font-size:13px;color:var(--muted)}
  .out{background:none;border:1px solid var(--line);color:var(--paper);border-radius:10px;padding:8px 14px;
    font:inherit;font-size:13px;cursor:pointer}

  nav.tabs{display:flex;gap:6px;padding:14px 22px 0;border-bottom:1px solid var(--line)}
  .tab{appearance:none;background:none;border:none;color:var(--muted);cursor:pointer;
    font:inherit;font-size:14.5px;font-weight:500;padding:10px 16px;border-bottom:2px solid transparent}
  .tab.active{color:var(--paper);border-bottom-color:var(--gold)}

  main{flex:1;padding:22px;max-width:960px;width:100%;margin:0 auto}
  .pane{display:none}
  .pane.active{display:block}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--muted)}
  .search{background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:10px 14px;
    color:var(--paper);font:inherit;font-size:14px;outline:none;min-width:220px}
  .search::placeholder{color:rgba(247,243,239,.32)}

  .card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
  .card-id{display:flex;flex-direction:column;gap:3px}
  .card-id b{font-size:16px;font-weight:600}
  .card-id .meta{font-size:12.5px;color:var(--muted)}
  .wa-link{color:var(--gold);text-decoration:none;font-size:13px}
  .chev{color:var(--muted);transition:transform .2s;flex:0 0 auto}
  .chev.open{transform:rotate(180deg)}
  .qa{display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
    display:none;grid-template-columns:1fr 1fr;gap:14px 24px}
  .qa.open{display:grid}
  .qa .row{display:flex;flex-direction:column;gap:3px}
  .qa .row.full{grid-column:1 / -1}
  .qa .row label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .qa .row .val{font-size:14.5px;line-height:1.45}
  .badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:4px 10px;
    border-radius:999px;background:rgba(255,224,0,.12);color:var(--gold);border:1px solid rgba(255,224,0,.3)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14.5px}

  /* alumnos */
  .btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    padding:11px 18px;border-radius:12px;border:none;background:var(--paper);color:var(--ink);
    font:inherit;font-size:14px;font-weight:600}
  .astat{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .acard{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px}
  .arow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .aname{font-size:16.5px;font-weight:600}
  .await{font-size:12.5px;color:var(--muted);margin-top:2px}
  .stpill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px}
  .stpill.done{background:rgba(61,220,132,.14);color:var(--green);border:1px solid rgba(61,220,132,.35)}
  .stpill.progress{background:rgba(255,224,0,.12);color:var(--gold);border:1px solid rgba(255,224,0,.3)}
  .stpill.pending{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.3)}
  .abar-wrap{margin-top:14px}
  .abar{height:8px;border-radius:8px;background:rgba(247,243,239,.08);overflow:hidden}
  .abar span{display:block;height:100%;background:var(--gold);border-radius:8px}
  .anums{display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px;color:var(--muted)}
  .aactions{display:flex;gap:8px;margin-top:14px}
  .aactions button{appearance:none;cursor:pointer;background:none;border:1px solid var(--line);color:var(--paper);
    border-radius:9px;padding:8px 14px;font:inherit;font-size:12.5px}
  .aactions button.del{color:var(--red);border-color:rgba(255,107,107,.35)}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50}
  .ov.open{display:flex}
  .modal{background:#141414;border:1px solid var(--line);border-radius:18px;padding:26px;width:100%;max-width:440px;
    max-height:90dvh;overflow-y:auto}
  .modal h3{font-size:19px;font-weight:600;margin-bottom:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .field .in{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    background:rgba(247,243,239,.04);color:var(--paper);font:inherit;font-size:14.5px;outline:none}
  .field .in:focus{border-color:rgba(247,243,239,.4)}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions .btn{flex:1;justify-content:center}
  .modal-actions .cancel{background:none;border:1px solid var(--line);color:var(--paper)}
</style>
</head>
<body>

<div id="login-screen">
  <h1>Panel · Mentoría Nakami</h1>
  <p>Acceso privado, solo para Jaime y el equipo. Inicia sesión con la cuenta de Google autorizada.</p>
  <button class="gbtn" id="btn-login">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.56-5.17 3.56-8.81z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.92l-3.88-3a7.4 7.4 0 0 1-4.07 1.16 7.4 7.4 0 0 1-6.96-5.14H1.03v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.04 14.1a7.24 7.24 0 0 1 0-4.6v-3.1H1.03a12 12 0 0 0 0 10.8z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0A12 12 0 0 0 1.03 6.4l4.01 3.1A7.4 7.4 0 0 1 12 4.77z"/></svg>
    Iniciar sesión con Google
  </button>
  <p class="denied" id="denied" style="display:none">Este correo no tiene acceso a este panel.</p>
</div>

<div id="app-screen">
  <header>
    <div class="brand"><b>Mentoría Nakami</b><span>Panel privado</span></div>
    <div class="who">
      <span id="who-email"></span>
      <button class="out" id="btn-logout">Salir</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="postulaciones">Postulaciones</button>
    <button class="tab" data-tab="alumnos">Alumnos</button>
  </nav>

  <main>
    <section class="pane active" id="pane-postulaciones">
      <div class="toolbar">
        <p class="count" id="post-count">Cargando…</p>
        <input class="search" id="post-search" placeholder="Buscar por nombre…">
      </div>
      <div id="post-list"></div>
    </section>

    <section class="pane" id="pane-alumnos">
      <div class="astat">
        <p class="count" id="al-count">Cargando…</p>
        <button class="btn" id="btn-new-alumno">+ Agregar alumno</button>
      </div>
      <div id="al-list"></div>
    </section>
  </main>
</div>

<!-- modal alumno -->
<div class="ov" id="ov-alumno">
  <div class="modal">
    <h3 id="al-modal-title">Agregar alumno</h3>
    <div class="field"><label>Nombre completo</label><input class="in" id="al-nombre" placeholder="Nombre y apellido"></div>
    <div class="field"><label>WhatsApp</label><input class="in" id="al-whatsapp" placeholder="+57 300 000 0000"></div>
    <div class="row2">
      <div class="field"><label>Monto total (USD)</label><input class="in" id="al-total" type="number" min="0" placeholder="1600"></div>
      <div class="field"><label>Monto pagado (USD)</label><input class="in" id="al-pagado" type="number" min="0" placeholder="800"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Cuotas totales</label><input class="in" id="al-cuotas-total" type="number" min="1" placeholder="2"></div>
      <div class="field"><label>Cuotas pagadas</label><input class="in" id="al-cuotas-pagadas" type="number" min="0" placeholder="1"></div>
    </div>
    <div class="field"><label>Notas (opcional)</label><input class="in" id="al-notas" placeholder="Ej: paga el 15 de cada mes"></div>
    <div class="modal-actions">
      <button class="btn cancel" id="al-cancel">Cancelar</button>
      <button class="btn" id="al-save">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQIgzrpOhSVyqrVyJFB6QKshBGSWZ0-gA",
  authDomain: "journal-nakami.firebaseapp.com",
  projectId: "journal-nakami",
  storageBucket: "journal-nakami.firebasestorage.app",
  messagingSenderId: "35698741930",
  appId: "1:35698741930:web:86182e348b41b293ccb6d3"
};

const ALLOWED_EMAILS = ['a1adsagencia@gmail.com','jaimeinfo96@gmail.com'];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id)=>document.getElementById(id);
const loginScreen = $('login-screen');
const appScreen = $('app-screen');

$('btn-login').onclick = ()=>{
  $('denied').style.display='none';
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>console.error(e));
};
$('btn-logout').onclick = ()=> signOut(auth);

let unsubPost=null, unsubAl=null;

onAuthStateChanged(auth, (user)=>{
  if(user && ALLOWED_EMAILS.includes(user.email)){
    loginScreen.style.display='none';
    appScreen.style.display='flex';
    $('who-email').textContent = user.email;
    startListeners();
  } else {
    if(unsubPost) unsubPost(); if(unsubAl) unsubAl();
    appScreen.style.display='none';
    loginScreen.style.display='flex';
    if(user){ $('denied').style.display='block'; signOut(auth); }
  }
});

/* ---- tabs ---- */
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('pane-'+t.dataset.tab).classList.add('active');
  };
});

/* ================= POSTULACIONES ================= */
const FIELD_LABELS = {
  edad:'Edad', experiencia:'Experiencia en trading', fondeo_exp:'Experiencia con fondeo',
  retiro_max:'Máx. retirado', obstaculo:'Mayor obstáculo', horas:'Horas/semana disponibles',
  disposicion:'Disposición a seguir el proceso', ingresos:'Ingresos mensuales',
  capital_evaluaciones:'Capital para evaluación', inversion:'Listo para invertir', porque:'Por qué ahora'
};
let allPostulaciones = [];

function startListeners(){
  const qPost = query(collection(db,'postulaciones'), orderBy('creadoEn','desc'));
  unsubPost = onSnapshot(qPost, (snap)=>{
    allPostulaciones = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderPostulaciones();
  });

  const qAl = query(collection(db,'alumnos'), orderBy('creadoEn','desc'));
  unsubAl = onSnapshot(qAl, (snap)=>{
    renderAlumnos(snap.docs.map(d=>({id:d.id, ...d.data()})));
  });
}

$('post-search').addEventListener('input', renderPostulaciones);

function renderPostulaciones(){
  const term = $('post-search').value.trim().toLowerCase();
  const list = $('post-list');
  const rows = allPostulaciones.filter(p=>!term || (p.nombre||'').toLowerCase().includes(term));
  $('post-count').textContent = rows.length + (rows.length===1 ? ' postulación' : ' postulaciones');
  if(rows.length===0){ list.innerHTML = '<p class="empty">Todavía no hay postulaciones.</p>'; return; }

  list.innerHTML='';
  rows.forEach(p=>{
    const card = document.createElement('div'); card.className='card';
    const fecha = p.fecha ? new Date(p.fecha).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}) : '';
    const waNum = (p.whatsapp||'').replace(/[^\d+]/g,'');
    const extraRows = Object.keys(FIELD_LABELS).map(k=>{
      if(!p[k]) return '';
      const full = (k==='porque') ? ' full' : '';
      return `<div class="row${full}"><label>${FIELD_LABELS[k]}</label><div class="val">${escapeHtml(p[k])}</div></div>`;
    }).join('');
    card.innerHTML = `
      <div class="card-top">
        <div class="card-id">
          <b>${escapeHtml(p.nombre||'Sin nombre')}</b>
          <span class="meta">${fecha}${p.pais?' · '+escapeHtml(p.pais):''}</span>
        </div>
        <div style="display:flex;align-items:center;gap:14px">
          ${waNum?`<a class="wa-link" href="https://wa.me/${waNum}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp →</a>`:''}
          <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
      <div class="qa">${extraRows}</div>`;
    const top = card.querySelector('.card-top');
    const qa = card.querySelector('.qa');
    const chev = card.querySelector('.chev');
    top.onclick = ()=>{ qa.classList.toggle('open'); chev.classList.toggle('open'); };
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= ALUMNOS ================= */
let editingId = null;

$('btn-new-alumno').onclick = ()=> openAlumnoModal(null);
$('al-cancel').onclick = ()=> $('ov-alumno').classList.remove('open');

function openAlumnoModal(alumno){
  editingId = alumno ? alumno.id : null;
  $('al-modal-title').textContent = alumno ? 'Editar alumno' : 'Agregar alumno';
  $('al-nombre').value = alumno?.nombre || '';
  $('al-whatsapp').value = alumno?.whatsapp || '';
  $('al-total').value = alumno?.montoTotal ?? '';
  $('al-pagado').value = alumno?.montoPagado ?? '';
  $('al-cuotas-total').value = alumno?.cuotasTotal ?? '';
  $('al-cuotas-pagadas').value = alumno?.cuotasPagadas ?? '';
  $('al-notas').value = alumno?.notas || '';
  $('ov-alumno').classList.add('open');
}

$('al-save').onclick = async ()=>{
  const nombre = $('al-nombre').value.trim();
  if(!nombre){ $('al-nombre').focus(); return; }
  const data = {
    nombre,
    whatsapp: $('al-whatsapp').value.trim(),
    montoTotal: Number($('al-total').value)||0,
    montoPagado: Number($('al-pagado').value)||0,
    cuotasTotal: Number($('al-cuotas-total').value)||0,
    cuotasPagadas: Number($('al-cuotas-pagadas').value)||0,
    notas: $('al-notas').value.trim()
  };
  try{
    if(editingId){
      await updateDoc(doc(db,'alumnos',editingId), data);
    } else {
      data.creadoEn = serverTimestamp();
      await addDoc(collection(db,'alumnos'), data);
    }
    $('ov-alumno').classList.remove('open');
  }catch(e){ console.error(e); alert('No se pudo guardar. Revisa la consola.'); }
};

function renderAlumnos(rows){
  $('al-count').textContent = rows.length + (rows.length===1 ? ' alumno' : ' alumnos');
  const list = $('al-list');
  if(rows.length===0){ list.innerHTML = '<p class="empty">Todavía no hay alumnos registrados.</p>'; return; }
  list.innerHTML='';
  rows.forEach(a=>{
    const pct = a.montoTotal>0 ? Math.min(100, Math.round((a.montoPagado/a.montoTotal)*100)) : 0;
    let stClass='pending', stText='Pendiente';
    if(a.montoTotal>0 && a.montoPagado>=a.montoTotal){ stClass='done'; stText='Pagado completo'; }
    else if(a.montoPagado>0){ stClass='progress'; stText='En curso'; }
    const card = document.createElement('div'); card.className='acard';
    card.innerHTML = `
      <div class="arow">
        <div>
          <div class="aname">${escapeHtml(a.nombre)}</div>
          ${a.whatsapp?`<div class="await">${escapeHtml(a.whatsapp)}</div>`:''}
        </div>
        <span class="stpill ${stClass}">${stText}</span>
      </div>
      <div class="abar-wrap">
        <div class="abar"><span style="width:${pct}%"></span></div>
        <div class="anums">
          <span>$${(a.montoPagado||0).toLocaleString('es-CO')} de $${(a.montoTotal||0).toLocaleString('es-CO')}</span>
          <span>Cuotas: ${a.cuotasPagadas||0} / ${a.cuotasTotal||0}</span>
        </div>
      </div>
      ${a.notas?`<div class="await" style="margin-top:10px">${escapeHtml(a.notas)}</div>`:''}
      <div class="aactions">
        <button class="edit">Editar</button>
        <button class="del">Eliminar</button>
      </div>`;
    card.querySelector('.edit').onclick = ()=> openAlumnoModal(a);
    card.querySelector('.del').onclick = async ()=>{
      if(confirm(`¿Eliminar a ${a.nombre}? Esta acción no se puede deshacer.`)){
        await deleteDoc(doc(db,'alumnos',a.id));
      }
    };
    list.appendChild(card);
  });
}
</script>
</body>
</html>
